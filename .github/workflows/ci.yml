name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: '10.0.x'
  # Keep in sync with the Velopack PackageReference in src/Catomania/Catomania.csproj
  # and with the versions used by release.yml.
  VPK_VERSION: '1.2.161'
  GITVERSION_VERSION: '6.3.0'

# A newer push to the same branch supersedes the running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # GitVersion needs the full history to calculate the version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ./src/Catomania.sln

      - name: Build
        run: dotnet build ./src/Catomania.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test ./src/Catomania.Tests --configuration Release --no-build
          --logger trx --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: ./artifacts/test-results
          if-no-files-found: ignore

  # Compiles on every platform to catch platform specific code and analyzer errors early,
  # without paying for a full Native AOT publish.
  compile-check:
    name: Compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build ./src/Catomania.sln --configuration Release

  # Publishes a real Native AOT binary, packs it with Velopack and proves it starts. This is the
  # check that matters: trimming and AOT problems only surface at publish time or at runtime,
  # never in a plain build. It runs the exact same Cake targets as release.yml, so the uploaded
  # artifacts are the ready-to-deploy Velopack files (installers, portable packages, update
  # feeds) instead of the raw publish output.
  aot-verify:
    name: Package & AOT verify (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
            exe: Catomania
            target: Publish-Linux
            arch: x64
            channel: linux
          - os: windows-latest
            rid: win-x64
            exe: Catomania.exe
            target: Publish-Windows
            arch: x64
            channel: win
          - os: macos-latest
            rid: osx-arm64
            exe: Catomania
            target: Publish-Mac
            arch: arm64
            channel: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install the build tools
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global vpk --version "${VPK_VERSION}"
          dotnet tool install --global gitversion.tool --version "${GITVERSION_VERSION}"

      - name: Install the Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang and zlib are required by the ILCompiler, squashfs-tools by the Velopack
          # AppImage packer, the rest by Avalonia at runtime.
          sudo apt-get install -y clang zlib1g-dev squashfs-tools xvfb \
            libx11-6 libice6 libsm6 libfontconfig1 libglib2.0-0

      # Runs the same Cake Frosting target as release.yml: it publishes the Native AOT binary
      # into ./output/publish and packs it with Velopack into ./output/releases/<channel>.
      # The version is calculated by GitVersion, so CI packages get a prerelease version.
      - name: Publish and package (Native AOT + Velopack)
        shell: bash
        env:
          CATOMANIA_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          dotnet run --project ./src/Catomania.Build/Catomania.Build.csproj -- \
            --target=${{ matrix.target }} \
            2>&1 | tee ./artifacts/publish.log

      - name: Fail on AOT analyzer warnings
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'warning (IL|NETSDK)[0-9]+' ./artifacts/publish.log; then
            echo "::error::Native AOT analyzer warnings found:"
            grep -E 'warning (IL|NETSDK)[0-9]+' ./artifacts/publish.log | sort -u
            exit 1
          fi
          echo "No AOT analyzer warnings."

      - name: Check the native dependencies were deployed
        shell: bash
        run: |
          set -euo pipefail
          ls -la ./output/publish
          test -f "./output/publish/${{ matrix.exe }}"
          # Skia and HarfBuzz are native libraries, they are not compiled into the AOT binary and
          # have to sit next to it or the application cannot render anything. The exact file names
          # differ per platform, so match on the library rather than on a hard coded name.
          for library in SkiaSharp HarfBuzzSharp; do
            if ! find ./output/publish -maxdepth 1 -name "*${library}*" | grep -q .; then
              echo "::error::No native ${library} library next to the AOT binary."
              exit 1
            fi
          done
          if [ "${{ runner.os }}" = "macOS" ]; then
            test -f ./output/publish/libAvaloniaNative.dylib
          fi

      - name: Smoke test the update check
        shell: bash
        run: |
          set -uo pipefail
          cd ./output/publish
          # Exercises the Velopack locator, HttpClient, JSON feed parsing and SemanticVersion,
          # the paths that used to rely on reflection before the source generated context.
          # A missing or unreachable feed is reported as an error by design and exits 1, that is
          # not an AOT problem, so only a crash or a stack trace fails this step.
          # The default feed is the latest GitHub release.
          set +e
          "./${{ matrix.exe }}" --update-check > ./update.log 2>&1
          status=$?
          set -e
          cat ./update.log
          case "${status}" in
            0|1) ;;
            *) echo "::error::The AOT binary exited with ${status}." ; exit 1 ;;
          esac
          if grep -qiE 'unhandled exception|at Catomania\.|System\.[A-Za-z.]*Exception' ./update.log; then
            echo "::error::The update check threw, the AOT build is broken."
            exit 1
          fi

      # Temporary disable because fails on CI.
      # - name: Smoke test the GUI (Linux, headless X)
      #   if: runner.os == 'Linux'
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     cd ./output/publish
      #     # The animal window has to open and the chase loop has to run without an exception.
      #     # The app reports unhandled exceptions on stderr and keeps running, so a non-empty
      #     # log means something broke at runtime under AOT.
      #     timeout --signal=TERM 15 xvfb-run --auto-servernum ./Catomania > ./gui.log 2>&1 || true
      #     cat ./gui.log
      #     test ! -s ./gui.log

      - name: List the Velopack output
        shell: bash
        run: |
          set -euo pipefail
          find ./output/releases -type f -exec ls -la {} \;

      # The ready-to-deploy Velopack files: installers (Setup.exe, .AppImage, .dmg), the full
      # and delta packages (.nupkg) and the update feeds (RELEASES, releases.<channel>.json).
      - name: Upload the Velopack release files
        uses: actions/upload-artifact@v5
        with:
          name: velopack-${{ matrix.channel }}
          path: ./output/releases/${{ matrix.channel }}
          if-no-files-found: error
